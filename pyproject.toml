[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos-daemon"
version = "0.6.0"
description = "A near-zero-footprint background daemon that silently records dev activity and lets you query your own work history in natural language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["developer-tools", "productivity", "ai", "memory", "cli"]
dependencies = [
    "watchdog>=4.0.0",
    "gitpython>=3.1.43",
    "requests>=2.31.0",
    "pydantic-settings>=2.2.1",
    "psutil>=5.9.8",
    "sqlite-vec>=0.1.0,<0.2.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.15.0",
    "tokenizers>=0.15.0",
    "pyperclip>=1.8.2",
    "rich>=13.7.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
contextos = "contextos.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
